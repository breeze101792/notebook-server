<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notebook — Graph 3D (design mockup)</title>
<style>
  /* ------------------------------------------------------------------ */
  /* Tokens — copied from static/css/style.css (dark root, light body).  */
  /* The graph canvas reads the --graph-*-rgb triples at runtime so the  */
  /* mockup and the production view share one colour contract.           */
  /* ------------------------------------------------------------------ */
  :root {
    --bg: #1a1b1f;
    --bg-panel: #22232a;
    --bg-elev: #2a2b34;
    --fg: #e6e6ea;
    --fg-muted: #8b8d98;
    --accent: #7c9cff;
    --accent-soft: rgba(124, 156, 255, 0.18);
    --border: #383a45;
    --danger: #ff6b6b;
    --accent-fg: #14151a;

    --graph-node-rgb: 130 168 255;
    --graph-node-hover-rgb: 150 220 255;
    --graph-edge-rgb: 124 156 255;
    --graph-glow-rgb: 150 220 255;
    --graph-warn-rgb: 243 180 84;
    --graph-dim-rgb: 80 92 120;
    --graph-label-rgb: 230 234 245;
    --graph-pulse-rgb: 180 230 255;
    --graph-particle-rgb: 130 168 255;
    --graph-vignette-inner-rgb: 60 90 180;
    --graph-vignette-edge-rgb: 14 16 24;
    --graph-bg: #0e1018;

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --topbar-h: 0px;
  }
  body[data-theme="light"] {
    --bg: #ffffff;
    --bg-panel: #f6f7f9;
    --bg-elev: #eceef2;
    --fg: #1f2330;
    --fg-muted: #5d6470;
    --accent: #2f5fd0;
    --accent-soft: rgba(47, 95, 208, 0.12);
    --border: #d8dde4;
    --danger: #c0392b;
    --accent-fg: #ffffff;

    --graph-node-rgb: 60 110 230;
    --graph-node-hover-rgb: 25 145 230;
    --graph-edge-rgb: 80 130 230;
    --graph-glow-rgb: 25 145 230;
    --graph-warn-rgb: 201 131 29;
    --graph-dim-rgb: 150 162 184;
    --graph-label-rgb: 31 35 48;
    --graph-pulse-rgb: 40 165 240;
    --graph-particle-rgb: 60 110 230;
    --graph-vignette-inner-rgb: 200 215 245;
    --graph-vignette-edge-rgb: 244 246 251;
    --graph-bg: #f4f6fb;
  }

  * { box-sizing: border-box; }
  html { font-size: 14px; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 1rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, output { font: inherit; }
  button { color: inherit; }

  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* ------------------------------------------------------------------ */
  /* Special-tab content area                                            */
  /* ------------------------------------------------------------------ */
  .graph-view {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    background: var(--bg);
  }

  /* ---- header ------------------------------------------------------ */
  .graph-header {
    position: relative;
    z-index: 5;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px 12px;
    min-height: 47px;
    padding: 8px 14px;
    background: color-mix(in oklab, var(--bg-panel) 86%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid color-mix(in oklab, var(--border) 70%, transparent);
  }
  .graph-header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    pointer-events: none;
    opacity: .55;
    background: linear-gradient(90deg,
      transparent 0%,
      color-mix(in oklab, var(--accent) 35%, transparent) 30%,
      color-mix(in oklab, var(--accent) 35%, transparent) 70%,
      transparent 100%);
  }
  .graph-heading {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .graph-title {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: .95rem;
    font-weight: 650;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .graph-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent),
                0 0 14px color-mix(in oklab, var(--accent) 60%, transparent);
    animation: graph-dot-pulse 2.4s ease-in-out infinite;
  }
  @keyframes graph-dot-pulse {
    0%, 100% { opacity: .55; transform: scale(.9); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
  .graph-badge {
    display: inline-flex;
    align-items: center;
    height: 16px;
    padding: 0 5px;
    border-radius: 4px;
    border: 1px solid color-mix(in oklab, var(--accent) 32%, transparent);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .1em;
    line-height: 1;
    transform: translateY(-1px);
  }
  .graph-summary {
    font-size: .78rem;
    color: var(--fg-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .graph-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    min-width: 0;
  }

  /* ---- filter ------------------------------------------------------ */
  .filter-wrap { position: relative; flex: 0 0 auto; }
  .filter-wrap > svg {
    position: absolute;
    left: 8px; top: 50%;
    width: 13px; height: 13px;
    transform: translateY(-50%);
    color: var(--fg-muted);
    pointer-events: none;
  }
  .graph-filter {
    width: 160px;
    height: 30px;
    padding: 0 8px 0 26px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    font-size: .82rem;
    outline: none;
  }
  .graph-filter::placeholder { color: var(--fg-muted); opacity: .9; }
  .graph-filter::-webkit-search-cancel-button { -webkit-appearance: none; }
  .graph-filter:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent);
  }

  /* ---- depth spread ------------------------------------------------- */
  .depth-control {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg-muted);
    cursor: pointer;
  }
  .depth-control:hover { color: var(--fg); }
  .depth-control > svg { width: 13px; height: 13px; flex: 0 0 auto; }
  .depth-range {
    width: 58px;
    height: 14px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .depth-range:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent);
    border-radius: 4px;
  }
  .depth-value {
    width: 30px;
    text-align: right;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    color: var(--fg-muted);
  }
  .tool-sep {
    width: 1px;
    height: 18px;
    margin: 0 2px;
    background: var(--border);
    flex: 0 0 auto;
  }

  /* ---- icon buttons ------------------------------------------------ */
  .graph-btn {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg-muted);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .graph-btn > svg { width: 15px; height: 15px; display: block; }
  .graph-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .graph-btn:active { transform: translateY(1px); }
  .graph-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .graph-btn:focus-visible,
  .demo-strip button:focus-visible,
  .demo-strip select:focus-visible,
  .state-action:focus-visible,
  .selection-close:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 28%, transparent);
    border-color: var(--accent);
  }
  .graph-filter:disabled,
  .depth-control:has(input:disabled),
  .graph-btn:disabled,
  .state-action:disabled {
    opacity: .42;
    cursor: not-allowed;
  }
  .graph-btn.is-spinning > svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- canvas host -------------------------------------------------- */
  .graph-host {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 45%,
        color-mix(in oklab, var(--graph-bg) 88%, var(--accent) 12%) 0%,
        var(--graph-bg) 62%);
    outline: none;
  }
  .graph-host:focus-visible {
    box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--accent) 72%, transparent);
  }
  #graph-canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .graph-host.is-grabbing #graph-canvas { cursor: grabbing; }

  /* ---- camera hint --------------------------------------------------- */
  .camera-hint {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translate(-50%, 0);
    z-index: 12;
    display: flex;
    align-items: center;
    gap: 7px;
    max-width: calc(100% - 32px);
    padding: 7px 12px;
    border: 1px solid color-mix(in oklab, var(--border) 82%, transparent);
    border-radius: 999px;
    background: color-mix(in oklab, var(--bg-panel) 82%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--fg-muted);
    font-size: 11.5px;
    line-height: 1.2;
    white-space: nowrap;
    pointer-events: none;
    opacity: 1;
    transition: opacity .38s ease, transform .38s ease;
  }
  .camera-hint .hint-sep { opacity: .55; }
  .camera-hint.is-hidden {
    opacity: 0;
    transform: translate(-50%, -5px);
  }
  .camera-hint .hint-touch { display: none; }
  body.touch-ui .camera-hint .hint-desktop { display: none; }
  body.touch-ui .camera-hint .hint-touch { display: inline; }
  @media (max-width: 720px) {
    .camera-hint {
      top: 10px;
      flex-wrap: wrap;
      justify-content: center;
      white-space: normal;
      text-align: center;
      gap: 4px 6px;
      font-size: 11px;
      border-radius: 12px;
    }
  }

  /* ---- selection chip ------------------------------------------------ */
  .selection-chip {
    position: absolute;
    right: 16px;
    bottom: 16px;
    z-index: 14;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: calc(100% - 32px);
    padding: 7px 8px 7px 11px;
    border: 1px solid color-mix(in oklab, var(--border) 86%, transparent);
    border-radius: 999px;
    background: color-mix(in oklab, var(--bg-panel) 90%, transparent);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    font-size: 11.5px;
    color: var(--fg-muted);
  }
  .selection-chip[hidden] { display: none; }
  .selection-dot {
    width: 6px; height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: rgb(var(--graph-warn-rgb));
    box-shadow: 0 0 8px rgb(var(--graph-warn-rgb) / .5);
  }
  .selection-name {
    color: var(--fg);
    font-weight: 600;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .selection-meta {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .selection-close {
    width: 22px; height: 22px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--fg-muted);
    cursor: pointer;
  }
  .selection-close:hover { background: var(--accent-soft); color: var(--fg); }
  .selection-close > svg { width: 11px; height: 11px; }

  /* ---- toast --------------------------------------------------------- */
  .toast {
    position: absolute;
    left: 50%;
    bottom: 20px;
    z-index: 16;
    transform: translate(-50%, 8px);
    max-width: min(520px, calc(100% - 32px));
    padding: 8px 13px;
    border: 1px solid color-mix(in oklab, var(--accent) 34%, var(--border));
    border-radius: 999px;
    background: color-mix(in oklab, var(--bg-panel) 92%, transparent);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: var(--fg);
    font-size: 12px;
    text-align: center;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .22);
    opacity: 0;
    transition: opacity .18s ease, transform .18s ease;
    pointer-events: none;
  }
  .toast[hidden] { display: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---- loading / empty / error -------------------------------------- */
  .state-layer {
    position: absolute;
    inset: 0;
    z-index: 18;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: color-mix(in oklab, var(--graph-bg) 66%, transparent);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .state-layer[hidden] { display: none; }
  .state-card {
    width: min(360px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 26px 28px 24px;
    border: 1px solid color-mix(in oklab, var(--border) 86%, transparent);
    border-radius: 14px;
    background: color-mix(in oklab, var(--bg-panel) 84%, transparent);
    box-shadow: 0 18px 48px rgba(0, 0, 0, .22);
  }
  .state-art { height: 56px; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; }
  .state-art > * { display: none; }
  .state-art[data-kind="loading"] .orbit-art { display: block; }
  .state-art[data-kind="empty"] .constellation-art { display: block; }
  .state-art[data-kind="error"] .broken-art { display: block; }

  .orbit-art {
    position: relative;
    width: 52px; height: 52px;
  }
  .orbit-art::before,
  .orbit-art::after {
    content: "";
    position: absolute;
    border-radius: 50%;
  }
  .orbit-art::before {
    inset: 6px;
    border: 1px solid color-mix(in oklab, var(--accent) 24%, var(--border));
  }
  .orbit-art::after {
    inset: 6px;
    background: conic-gradient(from 0deg, transparent 0 64%, var(--accent) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    animation: spin 1.35s linear infinite;
  }
  .orbit-art span {
    position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .constellation-art, .broken-art { width: 68px; height: 58px; overflow: visible; }
  .state-title {
    margin: 0;
    font-size: .98rem;
    font-weight: 650;
    color: var(--fg);
  }
  .state-body {
    margin: 6px 0 0;
    max-width: 30ch;
    font-size: .82rem;
    line-height: 1.5;
    color: var(--fg-muted);
  }
  .state-body code {
    padding: 1px 4px;
    border-radius: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: .92em;
    color: var(--fg);
  }
  .state-action {
    margin-top: 16px;
    height: 30px;
    padding: 0 14px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .state-action:hover { filter: brightness(1.06); }

  /* ------------------------------------------------------------------ */
  /* Mockup-only preview strip (not app chrome)                          */
  /* ------------------------------------------------------------------ */
  .demo-strip {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 40;
    max-width: calc(100vw - 32px);
    padding: 9px 10px 10px;
    border: 1px solid color-mix(in oklab, var(--border) 90%, transparent);
    border-radius: 12px;
    background: color-mix(in oklab, var(--bg-panel) 92%, transparent);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 14px 36px rgba(0, 0, 0, .3);
  }
  .demo-caption {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    color: var(--fg-muted);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  .demo-caption::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .demo-sub {
    margin-left: auto;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .01em;
    text-transform: none;
    opacity: .7;
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .seg {
    display: flex;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .seg button {
    height: 24px;
    padding: 0 9px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--fg-muted);
    font-size: 11px;
    cursor: pointer;
  }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .demo-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--fg-muted);
    font-size: 11px;
    cursor: pointer;
    user-select: none;
  }
  .demo-toggle input {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .demo-toggle .switch {
    position: relative;
    width: 28px; height: 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-elev);
    transition: background .15s ease, border-color .15s ease;
  }
  .demo-toggle .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--fg-muted);
    transition: transform .15s ease, background .15s ease;
  }
  .demo-toggle input:checked + .switch {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .demo-toggle input:checked + .switch::after {
    transform: translateX(12px);
    background: var(--accent);
  }
  .demo-toggle input:focus-visible + .switch {
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 28%, transparent);
  }
  .demo-state {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--fg-muted);
    font-size: 11px;
  }
  .demo-state select {
    height: 26px;
    padding: 0 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-size: 11px;
    cursor: pointer;
  }

  /* ------------------------------------------------------------------ */
  /* Narrow desktop / small window                                       */
  /* ------------------------------------------------------------------ */
  @media (max-width: 980px) {
    .graph-summary { display: none; }
  }
  @media (max-width: 820px) {
    .graph-header { gap: 8px 10px; }
    .graph-tools { flex-wrap: wrap; }
  }
  @media (max-width: 720px) {
    .demo-strip { left: 12px; bottom: 12px; right: 12px; max-width: none; }
    .selection-chip { right: 12px; bottom: 128px; }
    .toast { bottom: 78px; }
    .depth-control { display: none; }
    .selection-meta { display: none; }
  }
  @media (max-width: 520px) {
    .graph-header { padding: 8px 10px; flex-wrap: wrap; }
    .graph-heading { width: 100%; }
    .graph-tools { width: 100%; }
    .filter-wrap { min-width: 0; }
    .graph-title { font-size: .9rem; }
    .graph-btn { width: 32px; height: 32px; }
    .graph-filter { height: 32px; }
    .demo-row { gap: 8px; }
    .demo-sub { display: none; }
  }

  /* ------------------------------------------------------------------ */
  /* Coarse pointer / tablet: keep 44px targets when 3D is reachable     */
  /* ------------------------------------------------------------------ */
  @media (pointer: coarse) and (min-width: 1024px) {
    .graph-header { min-height: 60px; padding-top: 8px; padding-bottom: 8px; }
    .graph-btn { width: 44px; height: 44px; }
    .graph-btn > svg { width: 17px; height: 17px; }
    .graph-filter, .depth-control { height: 44px; }
    .graph-filter { width: 190px; }
    .depth-range { width: 72px; }
    .selection-close { width: 32px; height: 32px; }
  }

  /* ------------------------------------------------------------------ */
  /* Reduced motion                                                      */
  /* ------------------------------------------------------------------ */
  body.reduce-motion .graph-dot { animation: none; opacity: .85; }
  body.reduce-motion .orbit-art::after { animation: none; opacity: .55; }
  body.reduce-motion .graph-btn.is-spinning > svg { animation: none; }
  body.reduce-motion .camera-hint,

    ["architecture/frontend","hybrid-editing"], ["architecture/frontend","design/tab-system"],
    ["architecture/frontend","architecture/testing"], ["architecture/backend","api"],
    ["architecture/backend","safe-path"], ["architecture/backend","atomic-write"],
    ["architecture/backend","auth"], ["architecture/backend","seeding"],
    ["architecture/markdown","viewer"], ["architecture/markdown","hybrid-editing"],
    ["architecture/markdown","table-select"], ["architecture/ai-assistant","ai-panel"],
    ["architecture/ai-assistant","api"], ["architecture/context-menus","viewer"],
    ["architecture/context-menus","bookmarks"], ["architecture/mobile","design/mobile-shell"],
    ["architecture/mobile","product/mobile"], ["architecture/testing","performance-budget"],
    ["design/mobile-shell","product/mobile"], ["design/search-panel","search-panel"],
    ["design/search-panel","architecture/frontend"], ["design/settings-modal","theme-tokens"],
    ["design/graph-3d","graph"], ["design/graph-3d","design/graph-3d-notes"],
    ["design/edit-bar","viewer"], ["design/tab-system","viewer"],
    ["product/notebook","product/bookmarks"], ["product/auth","auth"],
    ["product/export","export"], ["product/bookmarks","bookmarks"],
    ["viewer","hybrid-editing"], ["viewer","outline"], ["hybrid-editing","table-view"],
    ["hybrid-editing","table-select"], ["table-view","table-select"],
    ["bookmarks","search-panel"], ["graph","architecture/frontend"],
    ["graph","performance-budget"], ["search-panel","architecture/frontend"],
    ["search-panel","viewer"], ["ai-panel","api"], ["ai-panel","search-panel"],
    ["export","viewer"], ["api","auth"], ["api","safe-path"],
    ["atomic-write","hybrid-editing"], ["watcher","api"], ["watcher","viewer"],
    ["seeding","vault-format"], ["design/graph-3d-notes","graph"],
    ["design/graph-3d-notes","performance-budget"], ["vault-format","architecture/backend"],
    ["keyboard-shortcuts","viewer"], ["keyboard-shortcuts","design/edit-bar"],
    ["theme-tokens","product/notebook"], ["performance-budget","search-panel"],
    ["open-questions","design/graph-3d"], ["open-questions","product/notebook"],

  // --- graph model ---------------------------------------------------
  var nodes = [];
  var edges = [];
  var byId = new Map();

  NODE_SPEC.forEach(function (spec) {
    var node = {
      id: spec.id, name: spec.name, cluster: spec.cluster, hub: !!spec.hub,
      degree: 0, neighbors: new Set(),
      x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,

  (function buildEdges() {
    var seen = new Set();
    EDGE_SPEC.forEach(function (pair) {
      var a = byId.get(pair[0]), b = byId.get(pair[1]);
      if (!a || !b || a === b) return;
      var key = a.id < b.id ? a.id + "\u0000" + b.id : b.id + "\u0000" + a.id;
      if (seen.has(key)) return;
      seen.add(key);
      var edge = { source: a, target: b, phase: (edges.length * 0.61803398875) % 1 };
      edges.push(edge);
      a.degree += 1; b.degree += 1;
      a.neighbors.add(b.id); b.neighbors.add(a.id);
    });

    hoverId: null,
    selectedId: null,
    selectedDist: null,

  var DEFAULT_PITCH = 0.30;
  var camTween = null;

  var basis = null;
  var projection = new Map();

  var el = {};
  function cacheEls() {

    el.host = document.getElementById("graph-host");

  // --- seeded layout -------------------------------------------------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seedLayout() {
    var rand = mulberry32(0x51CE7A11);
    nodes.forEach(function (n) {
      var c = CLUSTERS[n.cluster] || CLUSTERS.core;
      // Hub notes sit near the lobe centre; leaves fill the lobe volume.
      var r = (n.hub ? 0.24 : 0.86) * Math.cbrt(rand()) * c.r;
      var theta = rand() * TAU;
      var phi = Math.acos(2 * rand() - 1);
      n.x = c.x + Math.sin(phi) * Math.cos(theta) * r;
      n.y = c.y + Math.cos(phi) * r;
      n.z = c.z + Math.sin(phi) * Math.sin(theta) * r;
      n.vx = n.vy = n.vz = 0;
      n.fixed = false;
    });

  // --- 3D force simulation -------------------------------------------
  var REPULSION = 5200;
  var SPRING_LEN = 66;
  var SPRING_K = 0.011;
  var CLUSTER_K = 0.0024;
  var CENTER_K = 0.0005;
  var DAMPING = 0.85;
  var MAX_SPEED = 7;
  var SLEEP_EPS = 0.006;

  function stepPhysics() {
    var i, j, n = nodes.length;
    for (i = 0; i < n; i++) { nodes[i].fx = 0; nodes[i].fy = 0; nodes[i].fz = 0; }

    for (i = 0; i < n; i++) {
      var a = nodes[i];
      for (j = i + 1; j < n; j++) {
        var b = nodes[j];
        var dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
        var d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < 100) d2 = 100;
        var inv = 1 / Math.sqrt(d2);
        var f = REPULSION / d2;
        var fx = dx * inv * f, fy = dy * inv * f, fz = dz * inv * f;
        a.fx += fx; a.fy += fy; a.fz += fz;
        b.fx -= fx; b.fy -= fy; b.fz -= fz;
      }
    }

    for (i = 0; i < edges.length; i++) {
      var e = edges[i], s = e.source, t = e.target;
      var sx = t.x - s.x, sy = t.y - s.y, sz = t.z - s.z;
      var d = Math.sqrt(sx * sx + sy * sy + sz * sz) || 0.01;
      var spring = SPRING_K * (d - SPRING_LEN);
      var ux = sx / d, uy = sy / d, uz = sz / d;
      s.fx += ux * spring; s.fy += uy * spring; s.fz += uz * spring;
      t.fx -= ux * spring; t.fy -= uy * spring; t.fz -= uz * spring;
    }

    var energy = 0;
    for (i = 0; i < n; i++) {
      var node = nodes[i];
      var c = CLUSTERS[node.cluster] || CLUSTERS.core;
      node.fx += (c.x - node.x) * CLUSTER_K;
      node.fy += (c.y - node.y) * CLUSTER_K;
      node.fz += (c.z - node.z) * CLUSTER_K;
      node.fx -= node.x * CENTER_K;
      node.fy -= node.y * CENTER_K;
      node.fz -= node.z * CENTER_K;

      if (node.fixed || node === state.draggingNode) {
        node.vx = node.vy = node.vz = 0;
        continue;
      }
      node.vx = (node.vx + node.fx) * DAMPING;
      node.vy = (node.vy + node.fy) * DAMPING;
      node.vz = (node.vz + node.fz) * DAMPING;
      var speed = Math.sqrt(node.vx * node.vx + node.vy * node.vy + node.vz * node.vz);
      if (speed > MAX_SPEED) {
        var k = MAX_SPEED / speed;
        node.vx *= k; node.vy *= k; node.vz *= k;
        speed = MAX_SPEED;
      }
      node.x += node.vx; node.y += node.vy; node.z += node.vz;
      energy += speed * speed;
    }
    if (!state.draggingNode && energy / n < SLEEP_EPS) state.simRunning = false;
  }

  function warmUp() {
    for (var i = 0; i < 500; i++) stepPhysics();
    nodes.forEach(function (n) { n.vx = n.vy = n.vz = 0; });
    state.simRunning = false;
  }

  // --- colour utilities ----------------------------------------------
  function parseTriplet(s) {
    var m = String(s || "").trim().match(/^(\d+)\s+(\d+)\s+(\d+)$/);
    return m ? [+m[1], +m[2], +m[3]] : null;
  }
  function parseColor(s) {
    s = String(s || "").trim();
    var m = s.match(/^#([0-9a-f]{3})$/i);
    if (m) {
      return [parseInt(m[1][0], 16) * 17, parseInt(m[1][1], 16) * 17, parseInt(m[1][2], 16) * 17];
    }
    m = s.match(/^#([0-9a-f]{6})$/i);
    if (m) {
      return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
    }
    m = s.match(/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
    if (m) return [+m[1], +m[2], +m[3]];
    return null;
  }
  function rgba(triple, alpha) {
    if (!triple) return "rgba(0,0,0," + alpha + ")";
    return "rgba(" + triple[0] + "," + triple[1] + "," + triple[2] + "," + alpha + ")";
  }
  function mix(a, b, t) {
    if (!a) return b;
    if (!b) return a;
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function readPalette() {
    var cs = getComputedStyle(document.body);
    var get = function (name) { return cs.getPropertyValue(name).trim(); };
    palette = {
      node: parseTriplet(get("--graph-node-rgb")) || [130, 168, 255],
      hover: parseTriplet(get("--graph-node-hover-rgb")) || [150, 220, 255],
      edge: parseTriplet(get("--graph-edge-rgb")) || [124, 156, 255],
      glow: parseTriplet(get("--graph-glow-rgb")) || [150, 220, 255],
      warn: parseTriplet(get("--graph-warn-rgb")) || [243, 180, 84],
      dim: parseTriplet(get("--graph-dim-rgb")) || [80, 92, 120],
      label: parseTriplet(get("--graph-label-rgb")) || [230, 234, 245],
      pulse: parseTriplet(get("--graph-pulse-rgb")) || [180, 230, 255],
      vinIn: parseTriplet(get("--graph-vignette-inner-rgb")) || [60, 90, 180],
      vinOut: parseTriplet(get("--graph-vignette-edge-rgb")) || [14, 16, 24],
      bg: get("--graph-bg") || "#0e1018",
      bgTriple: parseColor(get("--graph-bg")) || [14, 16, 24],
      panel: parseColor(get("--bg-panel")) || [34, 35, 42],
      border: parseColor(get("--border")) || [56, 58, 69]
    };
  }

  // --- sprites -------------------------------------------------------
  function sphereSprite(color) {
    var key = "sphere:" + color.join(",");
    var hit = spriteCache.get(key);
    if (hit) return hit;
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(24, 21, 2, 32, 33, 33);
    grad.addColorStop(0, rgba(mix(color, [255, 255, 255], 0.42), 1));
    grad.addColorStop(0.52, rgba(color, 1));
    grad.addColorStop(1, rgba(mix(color, [0, 0, 0], 0.34), 1));
    g.fillStyle = grad;
    g.beginPath(); g.arc(32, 32, 32, 0, TAU); g.fill();
    spriteCache.set(key, c);
    return c;
  }

  function glowSprite(color) {
    var key = "glow:" + color.join(",");
    var hit = spriteCache.get(key);
    if (hit) return hit;
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(32, 32, 2, 32, 32, 32);
    grad.addColorStop(0, rgba(color, 0.55));
    grad.addColorStop(0.35, rgba(color, 0.20));
    grad.addColorStop(1, rgba(color, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    spriteCache.set(key, c);
    return c;
  }

  function buildVignette() {
    if (!palette || !width || !height) { vignette = null; return; }
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(width));
    c.height = Math.max(1, Math.round(height));
    var g = c.getContext("2d");
    var cx = width * 0.5, cy = height * 0.46;
    var grad = g.createRadialGradient(
      cx, cy, Math.min(width, height) * 0.05,
      cx, height * 0.52, Math.max(width, height) * 0.80
    );
    grad.addColorStop(0, rgba(palette.vinIn, 0.22));
    grad.addColorStop(0.5, rgba(palette.vinIn, 0.07));
    grad.addColorStop(1, rgba(palette.vinOut, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, width, height);
    vignette = c;
  }

  // --- canvas sizing + projection ------------------------------------
  function sizeCanvas() {
    if (!el.host || !canvas) return;
    var rect = el.host.getBoundingClientRect();
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var bw = Math.round(width * dpr), bh = Math.round(height * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    focal = (Math.min(width, height) / 2) / Math.tan(cam.fov / 2);
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildVignette();
    state.dirty = true;
  }

  function computeBasis() {
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    var dir = { x: cp * sy, y: sp, z: cp * cy };
    var pos = {
      x: cam.target.x + dir.x * cam.dist,
      y: cam.target.y + dir.y * cam.dist,
      z: cam.target.z + dir.z * cam.dist
    };
    var fwd = { x: -dir.x, y: -dir.y, z: -dir.z };
    var rx = -fwd.z, ry = 0, rz = fwd.x;
    var rl = Math.hypot(rx, rz) || 1;
    rx /= rl; rz /= rl;
    var ux = ry * fwd.z - rz * fwd.y;
    var uy = rz * fwd.x - rx * fwd.z;
    var uz = rx * fwd.y - ry * fwd.x;
    basis = {
      pos: pos, fwd: fwd,
      right: { x: rx, y: ry, z: rz },
      up: { x: ux, y: uy, z: uz }
    };
    return basis;
  }

  function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }

  function projectPoint(p, b) {
    var rel = { x: p.x - b.pos.x, y: p.y - b.pos.y, z: p.z - b.pos.z };
    var cz = dot(rel, b.fwd);
    if (cz <= 12) return null;
    var cx = dot(rel, b.right);
    var cy = dot(rel, b.up);
    return {
      x: width / 2 + (cx / cz) * focal,
      y: height / 2 - (cy / cz) * focal,
      depth: cz,
      scale: focal / cz
    };
  }

  function displayPos(n) {
    return { x: n.x, y: n.y, z: n.z * state.depthScale };
  }

  function projectNode(n, b) {
    return projectPoint(displayPos(n), b);
  }

  function worldRadius(n) {
    return 6.2 + Math.min(9.5, Math.sqrt(n.degree) * 2.2);
  }

  function fitCamera(animate) {
    var b = computeBasis();
    var pts = nodes.map(displayPos);
    var cx = 0, cy = 0, cz = 0;
    pts.forEach(function (p) { cx += p.x; cy += p.y; cz += p.z; });
    cx /= pts.length; cy /= pts.length; cz /= pts.length;
    var radius = 60;
    pts.forEach(function (p) {
      var d = Math.hypot(p.x - cx, p.y - cy, p.z - cz);
      if (d > radius) radius = d;
    });
    var dist = clamp(radius / Math.sin(cam.fov / 2) * 1.12, 260, 2800);
    var to = {
      yaw: DEFAULT_YAW, pitch: DEFAULT_PITCH, dist: dist,
      target: { x: cx, y: cy, z: cz }
    };
    if (!animate || state.reducedMotion) {
      setCamera(to);
      camTween = null;
    } else {
      camTween = {
        t0: performance.now(), dur: 440,
        from: { yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist,
                target: { x: cam.target.x, y: cam.target.y, z: cam.target.z } },
        to: to
      };
    }
    state.dirty = true;
  }

  function setCamera(to) {
    cam.yaw = to.yaw;
    cam.pitch = to.pitch;
    cam.dist = to.dist;
    cam.target.x = to.target.x;
    cam.target.y = to.target.y;
    cam.target.z = to.target.z;
  }

  function advanceTween(now) {
    if (!camTween) return false;
    var k = clamp((now - camTween.t0) / camTween.dur, 0, 1);
    var e = 1 - Math.pow(1 - k, 3);
    var f = camTween.from, t = camTween.to;
    cam.yaw = lerp(f.yaw, t.yaw, e);
    cam.pitch = lerp(f.pitch, t.pitch, e);
    cam.dist = lerp(f.dist, t.dist, e);
    cam.target.x = lerp(f.target.x, t.target.x, e);
    cam.target.y = lerp(f.target.y, t.target.y, e);
    cam.target.z = lerp(f.target.z, t.target.z, e);
    if (k >= 1) camTween = null;
    state.dirty = true;
    return true;
  }

  // --- screen / world conversion -------------------------------------
  function localPos(ev) {
    var r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  function rayFromScreen(sx, sy, b) {
    var nx = (sx - width / 2) / focal;
    var ny = -(sy - height / 2) / focal;
    var dir = {
      x: b.fwd.x + b.right.x * nx + b.up.x * ny,
      y: b.fwd.y + b.right.y * nx + b.up.y * ny,
      z: b.fwd.z + b.right.z * nx + b.up.z * ny
    };
    var l = Math.hypot(dir.x, dir.y, dir.z) || 1;
    dir.x /= l; dir.y /= l; dir.z /= l;
    return dir;
  }

  function pointOnPlane(sx, sy, planePoint, b) {
    var dir = rayFromScreen(sx, sy, b);
    var denom = dot(dir, b.fwd);
    if (Math.abs(denom) < 0.0001) return null;
    var t = dot({
      x: planePoint.x - b.pos.x,
      y: planePoint.y - b.pos.y,
      z: planePoint.z - b.pos.z
    }, b.fwd) / denom;
    return {
      x: b.pos.x + dir.x * t,
      y: b.pos.y + dir.y * t,
      z: b.pos.z + dir.z * t
    };
  }

  function panByPixels(dx, dy) {
    var b = computeBasis();
    var wpp = (2 * cam.dist * Math.tan(cam.fov / 2)) / Math.max(1, height);
    cam.target.x -= b.right.x * dx * wpp;
    cam.target.y -= b.right.y * dx * wpp;
    cam.target.z -= b.right.z * dx * wpp;
    cam.target.x += b.up.x * dy * wpp;
    cam.target.y += b.up.y * dy * wpp;
    cam.target.z += b.up.z * dy * wpp;
    state.dirty = true;
  }

  function zoomAt(sx, sy, factor, bias) {
    var b = computeBasis();
    var anchor = pointOnPlane(sx, sy, cam.target, b);
    var newDist = clamp(cam.dist * factor, 230, 3000);
    if (anchor) {
      var k = 1 - newDist / cam.dist;
      cam.target.x += (anchor.x - cam.target.x) * k * bias;
      cam.target.y += (anchor.y - cam.target.y) * k * bias;
      cam.target.z += (anchor.z - cam.target.z) * k * bias;
    }
    cam.dist = newDist;
    state.dirty = true;
  }

  // --- picking -------------------------------------------------------
  function pick(sx, sy, touch) {
    var b = computeBasis();
    var best = null, bestDepth = Infinity, bestScore = Infinity;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var p = projectNode(n, b);
      if (!p) continue;
      var sr = clamp(worldRadius(n) * p.scale, 2.4, 28);
      var hit = Math.max(touch ? 14 : 7, sr * 1.2 + 4);
      var d = Math.hypot(p.x - sx, p.y - sy);
      if (d > hit) continue;
      // Among overlapping hitboxes, prefer the node drawn on top (nearest).
      if (p.depth < bestDepth - 0.5) {
        best = n; bestDepth = p.depth; bestScore = d;
      } else if (Math.abs(p.depth - bestDepth) <= 0.5 && d < bestScore) {
        best = n; bestScore = d;
      }
    }
    return best;
  }

  // --- selection -----------------------------------------------------
  function distanceMap(startId) {
    var dist = new Map();
    dist.set(startId, 0);
    var queue = [startId];
    while (queue.length) {
      var cur = queue.shift();
      var d = dist.get(cur);
      var neighbors = byId.get(cur) ? byId.get(cur).neighbors : null;
      if (!neighbors) continue;
      neighbors.forEach(function (id) {
        if (!dist.has(id)) { dist.set(id, d + 1); queue.push(id); }
      });
    }
    return dist;
  }

  function selectNode(id) {
    if (!byId.has(id)) return;
    state.selectedId = id;
    state.selectedDist = distanceMap(id);
    updateChip();
    announceSelection();
    state.dirty = true;
  }

  function clearSelection() {
    if (!state.selectedId) return;
    state.selectedId = null;
    state.selectedDist = null;
    updateChip();
    el.srLive.textContent = "Selection cleared.";
    state.dirty = true;
  }

  function updateChip() {
    if (!state.selectedId) {
      el.chip.hidden = true;
      return;
    }
    var n = byId.get(state.selectedId);
    var hop1 = 0, hop2 = 0;
    state.selectedDist.forEach(function (d, id) {
      if (id === state.selectedId) return;
      if (d === 1) hop1 += 1;
      else if (d === 2) hop2 += 1;
    });
    el.chipName.textContent = n.name;
    el.chipMeta.textContent = n.degree + (n.degree === 1 ? " link" : " links") +
      " · " + hop1 + " at hop 1" + (hop2 ? " · " + hop2 + " at hop 2" : "");
    el.chip.hidden = false;
  }

  function announceSelection() {
    if (!state.selectedId) { el.srLive.textContent = "Selection cleared."; return; }
    var n = byId.get(state.selectedId);
    var hop1 = 0, hop2 = 0;
    state.selectedDist.forEach(function (d, id) {
      if (id === state.selectedId) return;
      if (d === 1) hop1 += 1;
      else if (d === 2) hop2 += 1;
    });
    el.srLive.textContent = "Selected " + n.name + ", " + n.degree +
      (n.degree === 1 ? " link" : " links") + ". " + hop1 +
      " direct " + (hop1 === 1 ? "neighbour" : "neighbours") + ", " + hop2 +
      " at two hops. Press Enter to open it, Escape to clear.";
  }

  function cycleSelection(dir) {
    var sorted = nodes.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    var idx = sorted.findIndex(function (n) { return n.id === state.selectedId; });
    if (idx < 0) idx = dir > 0 ? -1 : 0;
    idx = (idx + dir + sorted.length) % sorted.length;
    var n = sorted[idx];
    selectNode(n.id);
    var p = projectNode(n, computeBasis());
    if (!p || p.x < 24 || p.x > width - 24 || p.y < 24 || p.y > height - 24) {
      var to = {
        yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist,
        target: { x: n.x, y: n.y, z: n.z * state.depthScale }
      };
      if (state.reducedMotion) { setCamera(to); camTween = null; }
      else {
        camTween = {
          t0: performance.now(), dur: 320,
          from: { yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist,
                  target: { x: cam.target.x, y: cam.target.y, z: cam.target.z } },
          to: to
        };
      }
    }
    state.dirty = true;
  }

  // --- filter --------------------------------------------------------
  function updateFilter() {
    state.filter = (el.filter.value || "").trim().toLowerCase();
    if (!state.filter) {
      state.filterSet = null;
    } else {
      var set = new Set();
      nodes.forEach(function (n) {
        if (n.name.toLowerCase().indexOf(state.filter) >= 0 ||
            n.id.toLowerCase().indexOf(state.filter) >= 0) set.add(n.id);
      });
      state.filterSet = set;
    }
    updateSummary();
    state.dirty = true;
  }

  function updateSummary() {
    if (state.ready === "loading") { el.summary.textContent = "Reading links…"; return; }
    if (state.ready === "error") { el.summary.textContent = "Not connected"; return; }
    if (state.ready === "empty") { el.summary.textContent = "0 notes · 0 links"; return; }
    var text = nodes.length + " notes · " + edges.length + " links";
    if (state.filter) {
      var k = state.filterSet ? state.filterSet.size : 0;
      text += " · " + k + (k === 1 ? " match" : " matches");
    }
    el.summary.textContent = text;
  }

  // --- theme / motion ------------------------------------------------
  function setTheme(theme) {
    state.theme = theme === "light" ? "light" : "dark";
    document.body.dataset.theme = state.theme;
    el.themeButtons.forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.dataset.theme === state.theme ? "true" : "false");
    });
    readPalette();
    spriteCache.clear();
    buildVignette();
    state.dirty = true;
  }

  function setReducedMotion(on) {
    state.reducedMotion = !!on;
    document.body.classList.toggle("reduce-motion", state.reducedMotion);
    el.demoReduce.checked = state.reducedMotion;
    if (state.reducedMotion) {
      state.autoRotate = false;
      updateRotateButton();
    }
    el.rotate.disabled = state.reducedMotion || state.ready !== "ready";
    el.rotate.title = state.reducedMotion
      ? "Auto-orbit is off while reduced motion is on"
      : "Auto-orbit (R)";
    state.dirty = true;
  }

  function updateRotateButton() {
    el.rotate.setAttribute("aria-pressed", state.autoRotate ? "true" : "false");
    el.rotate.setAttribute("aria-label", state.autoRotate ? "Pause auto-orbit" : "Start auto-orbit");
  }

  // --- ready / loading / empty / error -------------------------------
  var STATE_COPY = {
    loading: {
      title: "Mapping your notebook…",
      body: "Reading links from your notes.",
      action: null
    },
    empty: {
      title: "Nothing to map yet",
      body: "Notes appear here once they exist. Link them with wikilinks or Markdown links to draw edges.",
      action: "Refresh"
    },
    error: {
      title: "Couldn’t load the graph",
      body: "The server didn’t answer. Check that the notebook is running, then try again.",
      action: "Retry"
    }
  };

  function setReady(kind) {
    state.ready = kind;
    el.demoState.value = kind;
    var ready = kind === "ready";
    el.stateLayer.hidden = ready;
    el.filter.disabled = !ready;
    el.depth.disabled = !ready;
    el.fit.disabled = !ready;
    el.zoomIn.disabled = !ready;
    el.zoomOut.disabled = !ready;
    el.rotate.disabled = !ready || state.reducedMotion;
    el.refresh.disabled = kind === "loading";

    if (!ready) {
      var copy = STATE_COPY[kind];
      el.stateArt.dataset.kind = kind;
      el.stateTitle.textContent = copy.title;
      el.stateBody.textContent = copy.body;
      if (copy.action) {
        el.stateAction.hidden = false;
        el.stateAction.textContent = copy.action;
      } else {
        el.stateAction.hidden = true;
      }
      el.chip.hidden = true;
    } else if (!state.selectedId) {
      el.chip.hidden = true;
    } else {
      updateChip();
    }

    if (kind === "error") {
      el.stateCard.setAttribute("role", "alert");
    } else {
      el.stateCard.setAttribute("role", "status");
    }
    updateSummary();
    state.dirty = true;
  }

  function simulateRefresh() {
    if (state.ready === "loading") return;
    setReady("loading");
    el.refresh.classList.add("is-spinning");
    window.setTimeout(function () {
      el.refresh.classList.remove("is-spinning");
      fitCamera(false);
      setReady("ready");
      showToast("Graph refreshed · " + nodes.length + " notes · " + edges.length + " links");
    }, state.reducedMotion ? 320 : 850);
  }

  // --- toast / hint --------------------------------------------------
  function showToast(message) {
    el.toast.textContent = message;
    el.toast.hidden = false;
    window.requestAnimationFrame(function () { el.toast.classList.add("show"); });
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      el.toast.classList.remove("show");
      window.setTimeout(function () { el.toast.hidden = true; }, state.reducedMotion ? 0 : 200);
    }, 3200);
  }

  var hintHidden = false;
  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    el.hint.classList.add("is-hidden");
    window.setTimeout(function () { el.hint.hidden = true; }, state.reducedMotion ? 0 : 420);
  }

  // --- pointer interaction -------------------------------------------
  var pointers = new Map();
  var gesture = null;         // orbit | pan | node | pinch
  var downInfo = null;
  var pinchPrev = null;
  var last = { x: 0, y: 0 };

  function setHover(id) {
    if (state.hoverId === id) return;
    state.hoverId = id;
    state.dirty = true;
  }

  function startNodeDrag(n, pos) {
    state.draggingNode = n;
    n.fixed = true;
    state.simRunning = true;
    dragNodeTo(pos);
  }

  function dragNodeTo(pos) {
    var n = state.draggingNode;
    if (!n) return;
    var b = computeBasis();
    var planePoint = { x: n.x, y: n.y, z: n.z * state.depthScale };
    var hit = pointOnPlane(pos.x, pos.y, planePoint, b);
    if (!hit) return;
    n.x = hit.x;
    n.y = hit.y;

      var p = list[i];
      if (r.x < p.x + p.w + 2 && r.x + r.w + 2 > p.x &&
          r.y < p.y + p.h + 2 && r.y + r.h + 2 > p.y) return true;
    }
    return false;
  }

  // --- frame loop ----------------------------------------------------
  var lastT = 0;
  function loop(now) {
    window.requestAnimationFrame(loop);
    if (!lastT) lastT = now;
    var dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
    lastT = now;

    var active = false;
    if (advanceTween(now)) active = true;
    if (state.autoRotate && !state.reducedMotion && !gesture) {
      cam.yaw += 0.075 * dt;
      active = true;
    }
    if (state.simRunning) {
      stepPhysics();
      active = true;
    }
    if (state.ready === "ready") {
      var ambient = !state.reducedMotion && (state.hoverId || state.selectedId);
      if (active || state.dirty || ambient) {
        draw(now);
        state.dirty = false;
      }
    }
  }

  // --- event wiring --------------------------------------------------
  function bindEvents() {
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    canvas.addEventListener("pointerleave", function () {
      if (!gesture) { setHover(null); canvas.style.cursor = "grab"; }
    });
    canvas.addEventListener("wheel", onWheel, { passive: false });
    canvas.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

    el.filter.addEventListener("input", updateFilter);
    el.filter.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") {
        ev.stopPropagation();
        if (el.filter.value) {
          el.filter.value = "";
          updateFilter();
        } else {
          el.host.focus();
        }
      }
    });

    el.depth.addEventListener("input", function () {
      var v = clamp(parseFloat(el.depth.value) || 0, 0, 100);
      var next = v / 100;
      var old = state.depthScale;
      if (old > 0.001) cam.target.z *= next / old;
      state.depthScale = next;
      el.depthValue.textContent = v + "%";
      el.depth.setAttribute("aria-valuetext", v + " percent");
      state.dirty = true;
    });

    el.rotate.addEventListener("click", function () {
      if (state.reducedMotion || state.ready !== "ready") return;
      state.autoRotate = !state.autoRotate;
      updateRotateButton();
      state.dirty = true;
    });

    el.fit.addEventListener("click", function () { fitCamera(true); });
    el.zoomIn.addEventListener("click", function () { zoomAt(width / 2, height / 2, 1 / 1.2, 0); });
    el.zoomOut.addEventListener("click", function () { zoomAt(width / 2, height / 2, 1.2, 0); });
    el.refresh.addEventListener("click", simulateRefresh);
    el.stateAction.addEventListener("click", simulateRefresh);
    el.chipClose.addEventListener("click", function () {
      clearSelection();
      el.host.focus({ preventScroll: true });
    });

    el.themeButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        setTheme(btn.dataset.theme);
        buildVignette();
      });
    });

    el.demoReduce.addEventListener("change", function () {
      el.demoReduce.dataset.touched = "1";
      setReducedMotion(el.demoReduce.checked);
      buildVignette();
      state.dirty = true;
    });

    el.demoState.addEventListener("change", function () {
      setReady(el.demoState.value);
    });

    el.host.addEventListener("keydown", onHostKeyDown);

    if (window.ResizeObserver && el.host) {
      try {
        new ResizeObserver(function () {
          sizeCanvas();
          state.dirty = true;
        }).observe(el.host);
      } catch (_) {}
    }
    window.addEventListener("resize", function () {
      sizeCanvas();
      state.dirty = true;
    });

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { state.dirty = true; lastT = 0; }
    });
  }

  function onHostKeyDown(ev) {
    if (state.ready !== "ready") return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;

    if (k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown") {
      ev.preventDefault();
      hideHint();
      camTween = null;
      var step = 0.075;
      if (ev.shiftKey) {
        var panStep = 26;
        if (k === "ArrowLeft") panByPixels(panStep, 0);
        else if (k === "ArrowRight") panByPixels(-panStep, 0);
        else if (k === "ArrowUp") panByPixels(0, panStep);
        else panByPixels(0, -panStep);
      } else {
        if (k === "ArrowLeft") cam.yaw += step;
        else if (k === "ArrowRight") cam.yaw -= step;
        else if (k === "ArrowUp") cam.pitch = clamp(cam.pitch - step, -1.22, 1.22);
        else cam.pitch = clamp(cam.pitch + step, -1.22, 1.22);
      }
      state.dirty = true;
      return;
    }

    if (k === "+" || k === "=" || k === "-" || k === "_") {
      ev.preventDefault();
      hideHint();
      camTween = null;
      zoomAt(width / 2, height / 2, (k === "+" || k === "=") ? 1 / 1.18 : 1.18, 0);
      return;
    }

    if (k === "Home" || k === "0") {
      ev.preventDefault();
      fitCamera(true);
      return;
    }

    if (k === "/") {
      ev.preventDefault();
      el.filter.focus();
      el.filter.select();
      return;
    }

    if (k === "r" || k === "R") {
      ev.preventDefault();
      if (!state.reducedMotion) {
        state.autoRotate = !state.autoRotate;
        updateRotateButton();
        state.dirty = true;
      }
      return;
    }

    if (k === "[" || k === "]") {
      ev.preventDefault();
      hideHint();
      cycleSelection(k === "]" ? 1 : -1);
      return;
    }

    if (k === "Enter") {
      ev.preventDefault();
      if (state.selectedId) {
        showToast("Would open “" + byId.get(state.selectedId).name + "” in a new tab.");
      } else {
        el.srLive.textContent = "No note selected. Use the left and right bracket keys to choose one.";
      }
      return;
    }

    if (k === "Escape") {
      ev.preventDefault();
      clearSelection();
    }
  }

  // --- boot ----------------------------------------------------------
  function boot() {
    cacheEls();
    if (!ctx) {
      el.stateLayer.hidden = false;
      el.stateArt.dataset.kind = "error";
      el.stateTitle.textContent = "Canvas unavailable";
      el.stateBody.textContent = "This browser cannot create a 2D canvas, so the graph cannot render.";
      return;
    }

    var prefersLight = false;
    var mqLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)");
    if (mqLight) prefersLight = mqLight.matches;
    setTheme(prefersLight ? "light" : "dark");

    var mqReduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    setReducedMotion(mqReduce ? mqReduce.matches : false);
    if (mqReduce && mqReduce.addEventListener) {
      mqReduce.addEventListener("change", function (e) {
        // The demo switch is the explicit override; only follow the OS while
        // the user has not touched it.
        if (!el.demoReduce.dataset.touched) setReducedMotion(e.matches);
      });
    }

    var mqTouch = window.matchMedia && window.matchMedia("(pointer: coarse)");
    if (mqTouch && mqTouch.matches) document.body.classList.add("touch-ui");

    seedLayout();
    warmUp();
    bindEvents();
    sizeCanvas();
    fitCamera(false);
    updateRotateButton();
    updateSummary();
    el.host.setAttribute("aria-label",
      "3D graph of " + nodes.length + " notes and " + edges.length + " links. " +
      "Drag to orbit. Scroll to zoom. Right-drag to pan. Click a note to select it. " +
      "Double-click a note to open it. Press left and right bracket to move the selection, " +
      "Enter to open, Escape to clear, Home to reset the camera.");

    window.requestAnimationFrame(function () {
      sizeCanvas();
      fitCamera(false);
      state.dirty = true;
    });
    window.requestAnimationFrame(loop);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
