<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table editor — hybrid mode modal</title>
<style>
  /* ------------------------------------------------------------------ */
  /* App tokens, copied verbatim from static/css/style.css.              */
  /* ------------------------------------------------------------------ */
  :root {
    --bg: #1a1b1f;
    --bg-panel: #22232a;
    --bg-elev: #2a2b34;
    --fg: #e6e6ea;
    --fg-muted: #8b8d98;
    --accent: #7c9cff;
    --accent-soft: rgba(124, 156, 255, 0.18);
    --accent-fg: #14151a;
    --border: #383a45;
    --danger: #ff6b6b;
    --danger-soft: rgba(255, 107, 107, .15);
    --warn: #f3b454;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --bg-panel: #f6f7f9;
    --bg-elev: #eceef2;
    --fg: #1f2330;
    --fg-muted: #5d6470;
    --accent: #2f5fd0;
    --accent-soft: rgba(47, 95, 208, 0.12);
    --accent-fg: #ffffff;
    --border: #d8dde4;
    --danger: #c0392b;
    --danger-soft: rgba(192, 57, 43, .12);
    --warn: #c9831d;
  }

  * { box-sizing: border-box; }
  html { font-size: 14px; }
  body {
    margin: 0;
    background: #0d0f14;
    color: #e6e6ea;
    font: 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  [data-theme="light"] body, body[data-theme="light"] { background: #f2f3f6; color: #1f2330; }

  /* ------------------------------------------------------------------ */
  /* Modal shell — the subset of style.css the new overlay inherits.     */
  /* ------------------------------------------------------------------ */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 2000;
    min-width: 0; min-height: 0;
  }
  .settings-modal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .settings-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; cursor: move;
  }
  .settings-header h2 { margin: 0; font-size: 1.14rem; font-weight: 600; letter-spacing: .3px; }
  .icon-btn {
    background: none; border: none; color: var(--fg-muted);
    font-size: 1.3rem; line-height: 1; padding: 4px 8px;
    border-radius: 6px; cursor: pointer;
  }
  .icon-btn:hover { color: var(--fg); background: var(--accent-soft); }
  .settings-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 12px 18px; border-top: 1px solid var(--border);
    background: var(--bg-panel); flex-shrink: 0;
  }
  .settings-action {
    background: var(--bg-elev); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 14px; font-family: inherit; font-size: .9rem; cursor: pointer;
  }
  .settings-action:hover { background: var(--accent-soft); border-color: var(--accent); }
  .settings-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .settings-action--primary {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-fg); font-weight: 600;
  }
  .settings-action--primary:hover {
    background: var(--accent); border-color: var(--accent); filter: brightness(1.06);
  }

  /* ------------------------------------------------------------------ */
  /* PROPOSED CSS — lift these rules into style.css. The app scopes the  */
  /* tokens to #table-editor-overlay; the mockup scopes them to the      */
  /* modal so each figure can carry its own theme.                       */
  /* ------------------------------------------------------------------ */
  .table-editor-modal {
    --te-space-1: 4px; --te-space-2: 6px; --te-space-3: 8px;
    --te-space-4: 12px; --te-space-5: 16px;
    --te-radius: 6px; --te-tool: 28px;
    --te-cell-min-w: 140px; --te-cell-max-w: 380px;
    --te-row-hover: var(--bg-elev);
    --te-col-hover: rgba(124, 156, 255, .07);
    /* The one new value (table-editor-selection.md §2): one step lighter
     * than --accent-soft, so the active cell always out-reads the range. */
    --te-sel-fill: rgba(124, 156, 255, .10);
    --fg-muted: #9799a4;           /* 4.26:1 -> >4.5:1 on --bg-elev */
    --te-focus-ring: 2px solid var(--accent);
    width: min(960px, 94vw);
    height: min(640px, 88vh);
  }
  [data-theme="light"] .table-editor-modal {
    --te-col-hover: rgba(47, 95, 208, .07);
    --te-sel-fill: rgba(47, 95, 208, .08);
    --fg-muted: #5d6470;
  }

  .te-body {
    display: flex; flex-direction: column;
    flex: 1 1 auto; min-height: 0; min-width: 0; padding: 0;
  }

  /* ---------------------------------------------------------- toolbar */
  .te-toolbar {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: var(--te-space-1);
    padding: var(--te-space-3) var(--te-space-4);
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    flex: 0 0 auto;
  }
  .te-group { display: inline-flex; align-items: center; gap: 2px; }
  .te-sep {
    width: 1px; height: 18px; background: var(--border);
    margin: 0 var(--te-space-2); flex: 0 0 auto;
  }
  .te-spacer { flex: 1 1 auto; }
  .te-gap { width: 4px; flex: 0 0 auto; }
  .te-row-grip, .te-col-grip {
    position: absolute; display: flex; align-items: center;
    justify-content: center; color: var(--fg-muted); opacity: 0;
    cursor: grab; touch-action: none;
  }
  .te-row-grip { left: 1px; top: 50%; width: 10px; height: 20px; transform: translateY(-50%); }
  .te-col-grip { top: 1px; left: 50%; width: 16px; height: 10px; transform: translateX(-50%); }
  .te-col-grip svg { transform: rotate(90deg); }
  tr:hover .te-row-grip, thead .te-cell:hover .te-col-grip { opacity: .65; }
  .te-fill-handle {
    position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px;
    background: var(--accent); border: 1px solid var(--bg-panel);
    border-radius: 2px; cursor: crosshair; z-index: 4;
  }
  .te-cell.is-fill-preview {
    background-image: linear-gradient(var(--te-sel-fill), var(--te-sel-fill));
  }
  .te-tool {
    display: inline-flex; align-items: center; justify-content: center;
    width: var(--te-tool); height: var(--te-tool); padding: 0;
    border: 1px solid transparent; border-radius: var(--te-radius);
    background: transparent; color: var(--fg-muted);
    font-family: inherit; cursor: pointer;
  }
  .te-tool:hover { background: var(--accent-soft); color: var(--fg); }
  .te-tool:focus-visible { outline: var(--te-focus-ring); outline-offset: 1px; }
  .te-tool.is-danger:hover { background: var(--danger-soft); color: var(--danger); }
  .te-tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .te-tool[aria-disabled="true"] { opacity: .4; cursor: default; }
  .te-tool[aria-disabled="true"]:hover { background: transparent; color: var(--fg-muted); }
  .te-tool svg { width: 16px; height: 16px; display: block; }
  .te-clip-group .te-tool:active { background: var(--accent-soft); color: var(--accent); }
  .te-clip-group .te-tool[aria-disabled="true"]:active {
    background: transparent; color: var(--fg-muted);
  }

  .te-sort-label {
    margin: 0 var(--te-space-1) 0 var(--te-space-2);
    font-size: .76rem; color: var(--fg-muted); white-space: nowrap;
  }
  .te-sort-col {
    height: var(--te-tool); min-width: 132px; max-width: 190px;
    padding: 0 var(--te-space-2);
    background: var(--bg-elev); color: var(--fg);
    border: 1px solid var(--border); border-radius: var(--te-radius);
    font-family: inherit; font-size: .82rem; outline: none;
  }
  .te-sort-col:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .te-sort-col[aria-disabled="true"],
  .te-sort-col[disabled] { opacity: .4; cursor: default; }

  /* ------------------------------------------------------------- grid */
  .te-scroll {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    overscroll-behavior: contain;
    background: var(--bg-panel);
    padding: 0 var(--te-space-5) var(--te-space-4);
  }
  .te-grid { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  .te-cell {
    position: relative;
    min-width: var(--te-cell-min-w);
    padding: var(--te-space-2) 10px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: .93rem; line-height: 1.35;
    text-align: left; font-weight: 400;
    background: transparent;
    cursor: cell;
  }
  .te-cell:first-child { border-left: 1px solid var(--border); }
  thead .te-cell {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    font-weight: 600;
  }
  tbody tr:nth-child(even) .te-cell { background: var(--bg); }
  tbody tr:hover .te-cell { background: var(--te-row-hover); }
  .te-cell.is-col-hover {
    background-image: linear-gradient(var(--te-col-hover), var(--te-col-hover));
  }
  /* ---- selection rectangle (table-editor-selection.md §3) -------------
   * One wash, one 1px edge on the rectangle's outside, and the existing
   * active ring on top. The wash is a background-image so the zebra row
   * and the header's --bg-elev survive under it, and so it replaces the
   * column-hover wash instead of stacking with it. :not(.is-active) lets
   * the ring replace the edge on its own cell without source order. */
  .te-grid .te-cell.is-selected:not(.is-active) {
    background-image: linear-gradient(var(--te-sel-fill), var(--te-sel-fill));
    box-shadow:
      inset 0 var(--te-sel-t, 0px) 0 0 var(--accent),
      inset 0 var(--te-sel-b, 0px) 0 0 var(--accent),
      inset var(--te-sel-l, 0px) 0 0 0 var(--accent),
      inset var(--te-sel-r, 0px) 0 0 0 var(--accent);
  }
  .te-cell.is-sel-top { --te-sel-t: 1px; }
  .te-cell.is-sel-bottom { --te-sel-b: -1px; }
  .te-cell.is-sel-left { --te-sel-l: 1px; }
  .te-cell.is-sel-right { --te-sel-r: -1px; }
  .te-cell:focus { outline: none; }
  .te-grid .te-cell.is-active {
    background-color: var(--accent-soft);
    box-shadow: inset 0 0 0 2px var(--accent);
    z-index: 1;
  }
  thead .te-cell.is-active { z-index: 3; }
  .te-cell-text {
    display: block; max-width: var(--te-cell-max-w);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .te-cell-text:empty::after {
    content: "\00b7"; color: var(--fg-muted); opacity: .45;
  }
  .te-cell[data-sort] .te-cell-text::after {
    content: " \2191"; color: var(--accent); font-weight: 600;
  }
  .te-cell[data-sort="desc"] .te-cell-text::after { content: " \2193"; }
  /* The cell is its own edit surface: no overlay, no width jump. */
  .te-cell-text[contenteditable="true"] {
    outline: none; cursor: text; caret-color: var(--accent);
  }
  .te-cell a { color: var(--accent); pointer-events: none; }
  .te-grid[aria-readonly="true"] .te-cell { cursor: default; }

  /* ------------------------------------------------------ footer bits */
  .te-footer { align-items: center; }
  .te-status {
    margin-right: auto; font-size: .8rem; color: var(--fg-muted);
    min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .te-footer > .settings-action { flex: 0 0 auto; }
  .te-hint { margin-left: var(--te-space-3); color: var(--fg-muted); font-size: .78rem; }

  /* -------------------------------------------------- blocked notice */
  .te-notice-strip {
    display: flex; gap: var(--te-space-3); align-items: flex-start;
    padding: 10px 14px; flex: 0 0 auto;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
  }
  .te-notice-glyph { font-size: 1rem; line-height: 1.35; color: var(--warn); }
  .te-notice-strip p { margin: 0; font-size: .85rem; color: var(--fg); }
  .te-notice-strip p + p { margin-top: 2px; font-size: .8rem; color: var(--fg-muted); }

  /* The footer keeps one row: the status truncates, the hint leaves. */
  @media (max-width: 520px) {
    .table-editor-modal .te-hint { display: none; }
  }

  /* ------------------------------------------------------------------ */
  /* Mockup page chrome + stages (mockup only, never ship).              */
  /* ------------------------------------------------------------------ */
  .studio-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px 24px; padding: 16px 24px;
    background: #14161c; border-bottom: 1px solid #2a2c36;
  }
  .studio-kicker { color: #7c9cff; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .studio-bar h1 { margin: 2px 0 0; font-size: 1.05rem; font-weight: 600; color: #e6e6ea; }
  .studio-bar p { margin: 2px 0 0; font-size: 12px; color: #9aa0ae; }
  .theme-btn {
    background: #1d2028; color: #cfd3de; border: 1px solid #333744;
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .theme-btn:hover { border-color: #7c9cff; color: #fff; }

  .studio { max-width: 1120px; margin: 0 auto; padding: 24px 24px 64px; display: grid; gap: 28px; }
  .card {
    margin: 0; border: 1px solid #262a34; border-radius: 12px;
    background: #121419; overflow: hidden;
  }
  .card > figcaption {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    padding: 12px 16px; border-bottom: 1px solid #262a34;
    background: #14161c;
  }
  .card > figcaption b { font-size: 12px; color: #e6e6ea; }
  .card > figcaption span {
    font-size: 11px; color: #7c9cff; letter-spacing: .04em; text-transform: uppercase;
  }
  .card > figcaption small { flex: 1 1 100%; color: #9aa0ae; font-size: 11.5px; line-height: 1.5; }
  .card > p.notes { margin: 0; padding: 10px 16px 14px; color: #8f95a3; font-size: 11.5px; }

  .stage {
    position: relative; height: 700px; overflow: hidden;
    background: #101218;
  }
  .stage[data-theme="light"] { background: #eef0f4; }
  .stage--narrow { height: 620px; }
  .stage--short { height: 520px; }

  /* A pretend note behind the dimmed overlay. */
  .note { position: absolute; inset: 0; padding: 26px 32px; overflow: hidden; color: #c9cdd8; }
  .stage[data-theme="light"] .note { color: #3a3f4b; }
  .note h3 { margin: 0 0 4px; font-size: 15px; color: inherit; }
  .note p { margin: 0 0 12px; font-size: 12.5px; color: #8f95a3; }
  .note table { border-collapse: collapse; font-size: 12px; }
  .note th, .note td { border: 1px solid #333744; padding: 5px 10px; }
  .stage[data-theme="light"] .note th, .stage[data-theme="light"] .note td { border-color: #cfd4dd; }
  .note thead th { background: #1c1f27; }
  .stage[data-theme="light"] .note thead th { background: #e6e9ef; }

  /* Stage geometry: keep the shell rules, drop the fixed positioning. */
  .stage > .settings-overlay { position: absolute; inset: 0; z-index: 1; }
  .stage > .settings-overlay > .settings-modal {
    position: absolute; left: 50%; top: 50%;
  }
  .stage--narrow .settings-modal { width: calc(100% - 24px); height: calc(100% - 24px); }

  /* Entry-point card: a slice of the edit bar and its open table menu. */
  .entry { display: flex; flex-wrap: wrap; gap: 24px; padding: 20px 16px; align-items: flex-start; }
  .note-mini {
    min-width: 300px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg-panel);
  }
  .note-mini-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 8px; font-size: .8rem; color: var(--fg-muted);
  }
  .note-mini table { border-collapse: collapse; font-size: .8rem; color: var(--fg); }
  .note-mini th, .note-mini td { border: 1px solid var(--border); padding: 4px 9px; }
  .note-mini th { background: var(--bg-elev); font-weight: 600; }
  .te-entry-btn {
    width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-elev); color: var(--fg-muted); cursor: pointer;
  }
  .te-entry-btn:hover { color: var(--accent); background: var(--accent-soft); }
  .te-entry-btn svg { width: 14px; height: 14px; display: block; }
  .menu-head {
    padding: 4px 8px 6px; font-size: .7rem; letter-spacing: .07em;
    text-transform: uppercase; color: var(--fg-muted);
  }
  .eb-menu {
    width: 236px; padding: 4px;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .eb-menu button {
    display: block; width: 100%; padding: 5px 8px; border: 0; border-radius: 4px;
    background: transparent; color: var(--fg); font-family: inherit;
    font-size: .8rem; text-align: left; cursor: pointer;
  }
  .eb-menu button:hover, .eb-menu button.is-focus { background: #7c9cff; color: #14151a; }
  .eb-menu .sep { height: 1px; margin: 4px 2px; background: var(--border); }

  /* Control / cell state strip. */
  .strip { display: flex; flex-wrap: wrap; gap: 28px; padding: 20px 16px 8px; }
  .strip-group { display: grid; gap: 8px; }
  .strip-group > h4 {
    margin: 0; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    color: #8f95a3; font-weight: 600;
  }
  .strip-row { display: flex; align-items: center; gap: 10px; }
  .strip-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .strip-cap { font-size: 11px; color: #9aa0ae; }
  .strip-cap code { color: #7c9cff; font-size: 10.5px; }
  .demo-toolbar { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
  .demo-grid { border: 1px solid var(--border); }
  .demo-grid .te-cell { min-width: 96px; font-size: .85rem; }
  .demo-grid .te-cell:first-child { border-left: 0; }
  .demo-grid thead .te-cell { border-top: 0; position: static; }

  @media (max-width: 720px) {
    .studio { padding: 16px 12px 48px; }
    .stage { height: 560px; }
  }
</style>
</head>
<body>

<header class="studio-bar">
  <div>
    <div class="studio-kicker">Design mockup</div>
    <h1>Table editor — hybrid mode</h1>
    <p>docs/design/table-editor.md · source of truth for the web-engineer</p>
  </div>
  <button class="theme-btn" id="theme-toggle" type="button">Light theme</button>
</header>

<main class="studio">

  <!-- ============================================================ entry -->
  <figure class="card">
    <figcaption>
      <b>Entry points</b><span>two, both hybrid-only</span>
      <small>The right-click <b>Table</b> submenu gains <b>Edit table…</b> as its first item,
        above a separator, targeting the table under the caret. The active table's overlay
        gains a 24px <b>Edit table</b> control targeting that table. Preview mode has neither.</small>
    </figcaption>
    <div class="entry">
      <div class="note-mini">
        <div class="note-mini-head">
          <span>Register map</span>
          <button class="te-entry-btn" type="button" title="Edit table" aria-label="Edit table">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 3h12v10H2z"/><path d="M2 7h12M6 3v10"/></svg>
          </button>
        </div>
        <table>
          <thead><tr><th>Register</th><th>Address</th></tr></thead>
          <tbody>
            <tr><td>CTRL</td><td>0x4001_0000</td></tr>
            <tr><td>STATUS</td><td>0x4001_0004</td></tr>
            <tr><td>FIFO</td><td>0x4001_000C</td></tr>
          </tbody>
        </table>
      </div>
      <div class="eb-menu" role="menu" aria-label="Table">
        <div class="menu-head">Table</div>
        <button type="button" role="menuitem" class="is-focus">Edit table…</button>
        <div class="sep"></div>
        <button type="button" role="menuitem">Move row up</button>
        <button type="button" role="menuitem">Move row down</button>
        <button type="button" role="menuitem">Align column (cycle)</button>
        <div class="sep"></div>
        <button type="button" role="menuitem">Delete row</button>
        <button type="button" role="menuitem">Delete table</button>
      </div>
      <p class="notes" style="max-width:34ch;margin:0;padding:4px 0">
        Both call <code>NB.tableEditor.open(table)</code>; the modal is
        <code>#table-editor-overlay</code> through <code>NB.dialog.open()</code>.
      </p>
    </div>
  </figure>

  <!-- ============================================================= hero -->
  <figure class="card">
    <figcaption>
      <b>Editable state — dark</b><span>960 × 640 · 3 × 3 range selected</span>
      <small>Header row is row 0, sticky and visually distinct. A drag from CTRL to IRQ_EN across
        Register–Width leaves rows 2–4 by columns 1–3 selected: a <code>--te-sel-fill</code> wash,
        a 1px <code>--accent</code> line on the rectangle's outside, and the existing 2px inset
        ring on the active cell at its top-left corner. No cell is in text edit — a range
        collapses before editing starts. Toolbar is fixed above the only scroller; footer status
        left, Cancel / Apply right.</small>
    </figcaption>
    <div class="stage">
      <div class="note" aria-hidden="true">
        <h3>Register map</h3>
        <p>Block 0x4001 — peripheral control</p>
        <table>
          <thead><tr><th>Register</th><th>Address</th><th>Width</th><th>Reset</th><th>Notes</th></tr></thead>
          <tbody>

<script>
(function () {
  "use strict";

  /* ---- theme toggle (mockup chrome only) --------------------------- */
  var toggle = document.getElementById("theme-toggle");
  function setTheme(mode) {
    if (mode === "light") {
      document.body.setAttribute("data-theme", "light");
      toggle.textContent = "Dark theme";
    } else {
      document.body.removeAttribute("data-theme");
      toggle.textContent = "Light theme";
    }
  }
  toggle.addEventListener("click", function () {
    setTheme(document.body.getAttribute("data-theme") === "light" ? "dark" : "light");
  });

  /* ---- live grid: the interaction model from §7, demo scale -------- */
  Array.prototype.forEach.call(document.querySelectorAll(".te-grid.is-live"), setupGrid);

  function setupGrid(grid) {
    var statusEl = document.getElementById(grid.getAttribute("data-status"));

    function cells() { return Array.prototype.slice.call(grid.querySelectorAll(".te-cell")); }
    function textOf(cell) { return cell.querySelector(".te-cell-text"); }
    function setStatus(msg) { if (statusEl) statusEl.textContent = msg; }

    function report() {
      var active = grid.querySelector(".te-cell.is-active");
      if (!active) return;
      var rows = Array.prototype.slice.call(grid.rows);
      var r = rows.indexOf(active.parentElement);
      var c = Array.prototype.indexOf.call(active.parentElement.cells, active);
      /* 1-based, header row = row 1, matching aria-rowindex. */
      setStatus("Row " + (r + 1) + " of " + rows.length + " · Column " + (c + 1) + " of " + rows[0].cells.length);
    }

    /* The demo has no range model; a press collapses any range, as in the app. */
    function clearRange() {
      cells().forEach(function (c) {
        c.classList.remove("is-selected", "is-sel-top", "is-sel-bottom", "is-sel-left", "is-sel-right");
      });
    }

    /* Leaving a cell ends its edit session; the value is already in the DOM. */
    function commitAll() {
      Array.prototype.forEach.call(
        grid.querySelectorAll('.te-cell-text[contenteditable="true"]'),
        function (t) { t.removeAttribute("contenteditable"); }
      );
    }

    function setActive(cell) {
      commitAll();
      clearRange();
      cells().forEach(function (c) {
        c.classList.remove("is-active");
        c.setAttribute("tabindex", "-1");
      });
      cell.classList.add("is-active");
      cell.setAttribute("tabindex", "0");
      if (cell.scrollIntoView) cell.scrollIntoView({ block: "nearest", inline: "nearest" });
      report();
    }

    function caretToEnd(t) {
      var range = document.createRange();
      range.selectNodeContents(t);
      range.collapse(false);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function startEdit(cell, atEnd) {
      setActive(cell);
      var t = textOf(cell);
      t.setAttribute("contenteditable", "true");
      t.focus();
      if (atEnd) caretToEnd(t);
    }

    function move(cell, dr, dc) {
      commitAll();
      var rows = Array.prototype.slice.call(grid.rows);
      var r = rows.indexOf(cell.parentElement) + dr;
      var c = Array.prototype.indexOf.call(cell.parentElement.cells, cell) + dc;
      var targetRow = rows[Math.max(0, Math.min(rows.length - 1, r))];
      if (!targetRow) return;
      var target = targetRow.cells[Math.max(0, Math.min(targetRow.cells.length - 1, c))];
      if (target) {
        setActive(target);
        target.focus({ preventScroll: true });
      }
    }

    /* mousedown, not click: once the cell is editable the browser places the
     * caret where the user pressed. */
    grid.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      var cell = e.target.closest(".te-cell");
      if (!cell) return;
      var t = textOf(cell);
      if (t.getAttribute("contenteditable") === "true") return;
      setActive(cell);
      t.setAttribute("contenteditable", "true");
      window.setTimeout(function () {
        if (document.activeElement !== t) { t.focus(); caretToEnd(t); }
      }, 0);
    });

    grid.addEventListener("keydown", function (e) {
      var cell = e.target.closest(".te-cell");
      if (!cell) return;
      var t = e.target.closest(".te-cell-text");
      var editing = !!(t && t.getAttribute("contenteditable") === "true");

      if (editing) {
        if (e.key === "Escape") {
          e.preventDefault();
          commitAll();
          cell.focus({ preventScroll: true });
          setStatus("Edit ended — in the app this closes the modal");
        } else if (e.key === "Enter") {
          e.preventDefault();
          var down = cell;
          move(down, 1, 0);
        } else if (e.key === "Tab") {
          e.preventDefault();
          var across = cell;
          move(across, 0, e.shiftKey ? -1 : 1);
        }
        return;
      }

      if (e.key === "ArrowDown") { e.preventDefault(); move(cell, 1, 0); }
      else if (e.key === "ArrowUp") { e.preventDefault(); move(cell, -1, 0); }
      else if (e.key === "ArrowRight") { e.preventDefault(); move(cell, 0, 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); move(cell, 0, -1); }
      else if (e.key === "Enter" || e.key === "F2") {
        e.preventDefault();
        startEdit(cell, true);
      } else if (e.key === "Backspace" || e.key === "Delete") {
        e.preventDefault();
        textOf(cell).textContent = "";
        setStatus("Cell cleared");
      } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        startEdit(cell, true);
        if (document.execCommand) document.execCommand("insertText", false, e.key);
        else textOf(cell).textContent += e.key;
      }
    });

    /* Column hover: one class set per column change. */
    var hoverCol = -1;
    grid.addEventListener("pointerover", function (e) {
      var cell = e.target.closest(".te-cell");
      if (!cell) return;
      var col = Array.prototype.indexOf.call(cell.parentElement.cells, cell);
      if (col === hoverCol) return;
      hoverCol = col;
      cells().forEach(function (c) {
        var inCol = Array.prototype.indexOf.call(c.parentElement.cells, c) === col;
        c.classList.toggle("is-col-hover", inCol);
      });
    });
    grid.addEventListener("pointerleave", function () {
      hoverCol = -1;
      cells().forEach(function (c) { c.classList.remove("is-col-hover"); });
    });

    /* Adopt the pre-rendered active cell without stealing page focus or
     * ending its pre-rendered state. The demo opens on a 3 × 3 range, so the
     * pre-rendered status string is left alone. */
    var hadRange = !!grid.querySelector(".te-cell.is-selected");
    var initial = grid.querySelector(".te-cell.is-active") || cells()[0];
    cells().forEach(function (c) { c.setAttribute("tabindex", "-1"); });
    initial.classList.add("is-active");
    initial.setAttribute("tabindex", "0");
    if (!hadRange) report();
  }
})();
</script>
